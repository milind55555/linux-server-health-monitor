# Linux Server Health Monitor configuration
# Thresholds are percentages unless otherwise stated.
CPU_LOAD_PER_CORE_THRESHOLD=1.50
MEMORY_USED_PERCENT_THRESHOLD=85
DISK_USED_PERCENT_THRESHOLD=85
DISK_CHECK_PATHS="/ /var"
# Optional systemd service to monitor. Keep this to a non-critical test service in a lab.
MONITORED_SERVICE=""
# Automatic restart is disabled by default. Enable only for a disposable lab service.
AUTO_RESTART_SERVICE=false
# Log file; directory is created if possible. Falls back to stderr if unwritable.
LOG_FILE="${HOME}/linux-health-monitor.log"
# Optional alert command, e.g. /usr/bin/logger. Empty means log only.
ALERT_COMMAND="/usr/bin/logger"
